<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teams – GridBot Brawl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 24px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      min-height: 100vh;
      color: #f8fafc;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.25);
      border: 1px solid rgba(71, 85, 105, 0.3);
    }
    
    h1 {
      color: #f8fafc;
      text-align: center;
      margin-bottom: 32px;
      font-size: 2.5rem;
      font-weight: 700;
      text-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }
    
    .search-container {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
      padding: 20px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      border: 1px solid rgba(51, 65, 85, 0.5);
    }
    
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 16px 20px;
      background: rgba(59, 130, 246, 0.1);
      border-radius: 10px;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }
    
    .stats-text {
      color: #93c5fd;
      font-weight: 600;
      font-size: 14px;
    }
    
    .team-count {
      color: #60a5fa;
      font-weight: 700;
      font-size: 16px;
    }
    
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid rgba(71, 85, 105, 0.5);
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.8);
      color: #e2e8f0;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    button {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }
    
    table {
      border-collapse: collapse;
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    
    th, td {
      padding: 16px 20px;
      text-align: left;
      border-bottom: 1px solid rgba(71, 85, 105, 0.3);
    }
    
    th {
      background: rgba(59, 130, 246, 0.1);
      color: #93c5fd;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.025em;
    }
    
    td {
      color: #e2e8f0;
      font-size: 14px;
    }
    
    tr:hover {
      background: rgba(59, 130, 246, 0.05);
    }
    
    tr:last-child td {
      border-bottom: none;
    }
    
    a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    
    a:hover {
      color: #93c5fd;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav">
      <a class="brand" href="index.html">🤖 GridBot Brawl</a>
      <nav class="links">
        <a href="leaderboard.html?mode=duo">Leaderboards</a>
        <a href="teams.html">Teams</a>
        <a href="signup.html">Signup</a>
        <a href="guide.html">Guide</a>
        <a href="bots.html">Bots</a>
        <a href="maps.html">Maps</a>
      </nav>
    </div>
  </header>
  
  <div class="container">
    <h1>Teams Directory</h1>
    <div class="search-container">
      <input id="q" type="text" placeholder="Search team by name…">
      <button id="btn">🔍 Search</button>
    </div>
    
    <div class="stats-bar">
      <div id="stats" class="stats-text">Loading teams...</div>
      <div class="stats-text">🤖 Active Competition</div>
    </div>
    
    <table>
      <thead><tr><th>#</th><th>Team Name</th><th>Members</th><th>Created</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    async function load(query='') {
      try {
        const res = await fetch(`https://api.gridbotbrawl.com/teams?limit=1000&search=${encodeURIComponent(query)}`);
        const rows = await res.json();
        const tbody = document.getElementById('tbody');
        tbody.innerHTML='';
        
        // Update stats
        updateStats(rows.length, query);
        
        rows.forEach((t, idx) => {
        const tr = document.createElement('tr');
        const memberText = t.member_count === 1 ? '1 member' : `${t.member_count} members`;
        const dateFormatted = new Date(t.created_at).toLocaleDateString('en-US', { 
          year: 'numeric', 
          month: 'short', 
          day: 'numeric' 
        });
        tr.innerHTML = `<td><strong>${idx+1}</strong></td><td><a href="team.html?id=${t.id}" target="_blank">${t.name}</a></td><td>${memberText}</td><td>${dateFormatted}</td>`;
        tbody.appendChild(tr);
        });
      } catch (error) {
        console.error('Failed to load teams:', error);
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #ef4444; padding: 20px;">Failed to load teams. Please try again.</td></tr>';
      }
    }
    
    function updateStats(count, query) {
      const statsDiv = document.getElementById('stats');
      if (query) {
        statsDiv.innerHTML = `<span class="stats-text">Found <span class="team-count">${count}</span> teams matching "${query}"</span>`;
      } else {
        statsDiv.innerHTML = `<span class="stats-text">Total <span class="team-count">${count}</span> registered teams</span>`;
      }
    }
    document.getElementById('btn').onclick = ()=>{ load(document.getElementById('q').value);} ;
    // Enter key triggers search
    document.getElementById('q').addEventListener('keypress',(e)=>{if(e.key==='Enter'){load(e.target.value);} });
    load();
  </script>
</body>
</html>
