<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teams – GridBot Brawl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    th { background: #f5f5f5; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav">
      <a class="brand" href="index.html">�� GridBot Brawl</a>
      <nav class="links">
        <a href="leaderboard.html?mode=duo">Leaderboards</a>
        <a href="teams.html">Teams</a>
        <a href="signup.html">Signup</a>
        <a href="guide.html">Guide</a>
      </nav>
    </div>
  </header>
  <h1>Teams Directory</h1>
  <div style="margin-bottom:12px;">
    <input id="q" type="text" placeholder="Search team…" style="padding:6px;width:60%;">
    <button id="btn">Search</button>
  </div>
  <table>
    <thead><tr><th>#</th><th>Name</th><th>Members</th><th>Created</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>

  <script>
    async function load(query='') {
      const res = await fetch(`http://localhost:8000/teams?limit=1000&search=${encodeURIComponent(query)}`);
      const rows = await res.json();
      const tbody = document.getElementById('tbody');
      tbody.innerHTML='';
      rows.forEach((t, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${idx+1}</td><td><a href="team.html?id=${t.id}" target="_blank">${t.name}</a></td><td>${t.member_count}</td><td>${t.created_at.slice(0,10)}</td>`;
        tbody.appendChild(tr);
      });
    }
    document.getElementById('btn').onclick = ()=>{ load(document.getElementById('q').value);} ;
    // Enter key triggers search
    document.getElementById('q').addEventListener('keypress',(e)=>{if(e.key==='Enter'){load(e.target.value);} });
    load();
  </script>
</body>
</html>
