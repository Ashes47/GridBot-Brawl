<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup – GridBot Brawl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 24px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      min-height: 100vh;
      color: #f8fafc;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.25);
      border: 1px solid rgba(71, 85, 105, 0.3);
    }
    
    h1 {
      color: #f8fafc;
      text-align: center;
      margin-bottom: 32px;
      font-size: 2.5rem;
      font-weight: 700;
      text-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }
    
    h3 {
      color: #e2e8f0;
      margin: 24px 0 16px 0;
      font-size: 1.25rem;
      font-weight: 600;
    }
    
    label {
      display: block;
      margin-top: 20px;
      color: #cbd5e1;
      font-weight: 500;
      font-size: 15px;
    }
    
    input[type="text"], input[type="file"], input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(71, 85, 105, 0.5);
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.6);
      color: #e2e8f0;
      font-size: 14px;
      margin-top: 8px;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    
    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    button {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-top: 24px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    
    .card {
      border: 1px solid rgba(71, 85, 105, 0.3);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(51, 65, 85, 0.3);
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }
    
    .card:hover {
      background: rgba(59, 130, 246, 0.1);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      border-color: rgba(59, 130, 246, 0.4);
    }
    
    .card.selected {
      border: 2px solid #22c55e;
      background: rgba(34, 197, 94, 0.1);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    }
    
    .emoji {
      font-size: 24px;
      min-width: 32px;
    }
    
    .card-content {
      flex: 1;
    }
    
    .card-title {
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 4px;
    }
    
    .card-desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
    
    .pill {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
      margin-left: 8px;
    }
    
    .info-text {
      margin-top: 8px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }
    
    #result {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 500;
    }
    
    #result:not(:empty) {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav">
      <a class="brand" href="index.html">🤖 GridBot Brawl</a>
      <nav class="links">
        <a href="leaderboard.html?mode=duo">Leaderboards</a>
        <a href="teams.html">Teams</a>
        <a href="signup.html">Signup</a>
        <a href="guide.html">Guide</a>
        <a href="bots.html">Bots</a>
        <a href="maps.html">Maps</a>
      </nav>
    </div>
  </header>
  
  <div class="container">
    <h1>Team Signup</h1>
    <form id="signup-form" action="http://localhost:8000/teams" method="post" enctype="multipart/form-data">
    <label>Team Name
      <input type="text" name="name" required>
    </label>

    <label>Members (comma-separated)
      <input type="text" name="members" placeholder="Alice,Bob,Charlie" required>
    </label>

    <label>Password (for future updates)
      <input type="password" name="password" minlength="6" required>
    </label>

    <h3 style="margin-top:16px;">Select 5 Components (optional if you upload a bot file)</h3>
    <div id="cards" class="grid"></div>
    <div class="info-text">Pick exactly 5 unique components if you are not uploading a bot file. If you upload a file, we will auto-detect the first 5 component classes.</div>

    <input type="hidden" name="roster" id="roster-field" value="">

    <label style="margin-top:16px;">Upload Bot Code (single .py with component classes)
      <input type="file" name="bot_file" id="bot-file" accept=".py">
    </label>

      <button type="submit">Register Team</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById('signup-form');
    const resultEl = document.getElementById('result');
    const rosterField = document.getElementById('roster-field');
    const cardsDiv = document.getElementById('cards');
    const botInput = document.getElementById('bot-file');
    let components = [];
    let selected = new Set();

    function renderCards(){
      cardsDiv.innerHTML = '';
      components.forEach(c => {
        const div = document.createElement('div');
        div.className = 'card';
        if (selected.has(c.key)) div.classList.add('selected');
        div.innerHTML = `<span class="emoji">${c.emoji}</span><div class="card-content"><div class="card-title">${c.name} <span class="pill">${c.role}</span></div><div class="card-desc">CD ${c.cooldown} – ${c.description}</div></div>`;
        div.onclick = () => {
          if (selected.has(c.key)) { selected.delete(c.key); }
          else { if (selected.size < 5) selected.add(c.key); }
          renderCards();
        };
        cardsDiv.appendChild(div);
      });
    }

    async function loadComponents(){
      const res = await fetch('http://localhost:8000/metadata/components');
      const data = await res.json();
      components = data.components || [];
      renderCards();
    }
    loadComponents();

    // Fetch public config to check if signup is enabled (wrapped to avoid top-level await)
    (async ()=>{
      try {
        const r = await fetch('http://localhost:8000/metadata/config');
        const cfg = await r.json();
        if(cfg && cfg.signup_enabled === false){
          form.querySelectorAll('input,button').forEach(el=>{ el.disabled = true; });
          resultEl.textContent = 'Signup is currently disabled by the admin.';
        }
      } catch(e){ /* ignore */ }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const hasFile = botInput && botInput.files && botInput.files.length > 0;
      if (!hasFile && selected.size !== 5){ resultEl.textContent = 'Please select exactly 5 components or upload a bot file.'; return; }
      rosterField.value = selected.size === 5 ? JSON.stringify(Array.from(selected)) : '';
      const formData = new FormData(form);
      try {
        const res = await fetch(form.action, { method: 'POST', body: formData });
        if (!res.ok) {
          const txt = await res.text().catch(()=> 'Error');
          try { const j = JSON.parse(txt); throw new Error(j.detail || txt || 'Error'); } catch { throw new Error(txt || 'Error'); }
        }
        let id = null;
        const ct = res.headers.get('content-type') || '';
        if (ct.includes('application/json')) {
          try {
            const data = await res.json();
            id = data && data.id;
          } catch (_) { /* ignore */ }
        }
        if (!id) {
          // Fallback: look up team by name
          const teamName = (formData.get('name') || '').toString();
          try {
            const base = new URL(form.action).origin;
            const r = await fetch(`${base}/teams?search=${encodeURIComponent(teamName)}&limit=5`);
            if (r.ok) {
              const list = await r.json();
              const match = (Array.isArray(list) ? list : []).find(t => (t.name || '').toLowerCase() === teamName.toLowerCase());
              if (match && match.id) id = match.id;
            }
          } catch(_) { /* ignore */ }
        }
        if (!id) { id = ''; }
        resultEl.innerHTML = `<strong>Success!</strong> Redirecting to team page…`;
        window.location.href = `team.html?id=${id}`;
      } catch (err) {
        resultEl.textContent = 'Error: ' + err.message;
      }
    });
    
    // Add CSS for shake animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
