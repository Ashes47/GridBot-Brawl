version: "3.9"

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - botnet

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - .env
    ports:
      - "6379:6379"
    networks:
      - botnet

  backend:
    restart: always
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./data/teams:/app/data/teams
      - ./data/matches:/app/data/matches
      - ./maps:/app/maps
    networks:
      - botnet

  worker-baseline:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "-Q", "baseline", "--concurrency", "2", "-P", "threads", "-n", "baseline@%h"]
    depends_on:
      - backend
      - redis
    volumes:
      - ./data/teams:/app/data/teams
      - ./data/matches:/app/data/matches
      - ./maps:/app/maps
    networks:
      - botnet

  worker-simulation:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "-Q", "simulation", "--concurrency", "4", "-P", "threads", "-n", "simulation@%h"]
    depends_on:
      - backend
      - redis
    volumes:
      - ./data/teams:/app/data/teams
      - ./data/matches:/app/data/matches
      - ./maps:/app/maps
    networks:
      - botnet

  flower:
    build:
      context: ./backend
    env_file:
      - .env
    command: ["celery", "-A", "app.celery_app.celery_app", "flower", "--basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}"]
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - botnet

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./sample_bots:/usr/share/nginx/html/sample_bots
    depends_on:
      - backend
    networks:
      - botnet

networks:
  botnet:
    driver: bridge

volumes:
  db_data: 