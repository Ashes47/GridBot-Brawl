version: "3.9"

services:
  traefik:
    image: traefik:v2.10
    restart: always
    env_file:
      - .env
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - botnet
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - botnet

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - .env
    ports:
      - "6379:6379"
    networks:
      - botnet

  backend:
    restart: always
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./data/teams:/app/data/teams
      - ./data/matches:/app/data/matches
      - ./maps:/app/maps
    networks:
      - botnet
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`${BACKEND_DOMAIN}`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=le
      - traefik.http.services.backend.loadbalancer.server.port=8000

  worker-baseline:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "-Q", "baseline", "--concurrency", "${WORKER_BASE_CONCURRENCY:-12}", "-P", "threads", "-n", "baseline@%h"]
    depends_on:
      - backend
      - redis
    volumes:
      - ./data/teams:/app/data/teams
      - ./data/matches:/app/data/matches
      - ./maps:/app/maps
    networks:
      - botnet
    deploy:
      replicas: 2

  worker-simulation:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "-Q", "simulation", "--concurrency", "${WORKER_SIM_CONCURRENCY:-12}", "-P", "threads", "-n", "simulation@%h"]
    depends_on:
      - backend
      - redis
    volumes:
      - ./data/teams:/app/data/teams
      - ./data/matches:/app/data/matches
      - ./maps:/app/maps
    networks:
      - botnet
    deploy:
      replicas: 4

  worker-beat:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    command: ["celery", "-A", "app.celery_app.celery_app", "beat", "--pidfile=", "--loglevel=INFO"]
    depends_on:
      - backend
      - redis
    networks:
      - botnet

  flower:
    build:
      context: ./backend
    env_file:
      - .env
    command: ["celery", "-A", "app.celery_app.celery_app", "flower", "--basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}"]
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - botnet
    labels:
      - traefik.enable=true
      - traefik.http.routers.flower.rule=Host(`${FLOWER_DOMAIN}`)
      - traefik.http.routers.flower.entrypoints=websecure
      - traefik.http.routers.flower.tls=true
      - traefik.http.routers.flower.tls.certresolver=le
      - traefik.http.services.flower.loadbalancer.server.port=5555

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    ports:
      - "8080:80"
    volumes:
      - ./sample_bots:/usr/share/nginx/html/sample_bots
    depends_on:
      - backend
    networks:
      - botnet
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${FRONTEND_DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=le
      - traefik.http.services.frontend.loadbalancer.server.port=80
    environment:
      - API_BASE=https://${BACKEND_DOMAIN}

networks:
  botnet:
    driver: bridge

volumes:
  db_data: 
  traefik_letsencrypt: